<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mapa Flash – Paradas de Bariloche</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Leaflet core -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Leaflet‑search (buscador de paradas) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.2/dist/leaflet-search.min.css"/>
  <script src="https://unpkg.com/leaflet-search@3.0.2/dist/leaflet-search.min.js"></script>

  <style>
    html,body,#map{height:100%;margin:0}
    .leaflet-popup-content{font-size:.9rem;line-height:1.3}
  </style>
</head>
<body>
<div id="map"></div>

<script>
/*******************************************
 * Sólo tocá estos 3 nombres si cambiás los archivos *
 *******************************************/
const ALL_STOPS_GEOJSON     = 'paradas.geojson';  // desde "Paradas TUP.kmz"
const SHELTER_STOPS_GEOJSON = 'garitas.geojson';  // desde "Garitas TUP.kmz"
// URL al Google Form (en modo viewform, no edit) + parámetro pre‑fill del primer campo
const GOOGLE_FORM_URL =
  'https://docs.google.com/forms/d/e/1FAIpQLSe27E7WXRBnxScUw6AbTZnTmcjyJ_y2I8LEkR43yo6BxcpLkA/viewform?usp=pp_url&entry.288461742=';


// 1. Mapa base centrado en Bariloche
const map = L.map('map').setView([-41.1335,-71.3103],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap contributors',
  maxZoom:19
}).addTo(map);

// 2. Capas vacías donde pondremos los datos
const allStopsLayer     = L.layerGroup();
const shelterStopsLayer = L.layerGroup();
L.control.layers(null, {
  'Todas las paradas': allStopsLayer,
  'Paradas con refugio': shelterStopsLayer
}).addTo(map);

// 3. Estilo genérico de punto
function styleStop(color){
  return {radius:6, fillColor:color, color:'#fff', weight:1, fillOpacity:0.9};
}

// 4. Función reusable para cargar un GeoJSON
function addGeoLayer(url, layer, color){
  fetch(url)
  .then(r=>r.json())
  .then(g=>{
    const gj = L.geoJSON(g, {
      pointToLayer:(f,ll)=>L.circleMarker(ll,styleStop(color)),
      onEachFeature:(f,l)=>{
        const p = f.properties || {};
        // nombre
        const nombre = p.Name || 'Parada sin nombre';
        // id extraído de la descripción (si existe la cadena "Código: <número>")
        let id = '—';
        if(p.description){
          const m = p.description.match(/Código[:\s]*(\d+)/);
          if(m) id = m[1];
        }
        // refugio
        const refugio = p.Garita && p.Garita.toString().trim()!=='' ? 'Sí' : 'No';
        // link al formulario con el id pre‑rellenado
        const formLink = `${GOOGLE_FORM_URL}${encodeURIComponent(id)}`;
        l.bindPopup(
          `<strong>${nombre}</strong><br>ID: ${id}<br>Refugio: ${refugio}<br>`+
          `<a href="${formLink}" target="_blank">Agregar comentario →</a>`
        );
        // indexar para la búsqueda
        l.featureName = nombre;
      }
    });
    gj.addTo(layer);
    layer.addTo(map);
    // Añadimos al index de búsqueda
    searchControl.indexLayer(gj);
  });
}

// 5. Cargamos las dos capas
addGeoLayer(ALL_STOPS_GEOJSON, allStopsLayer, '#2A93D5');
addGeoLayer(SHELTER_STOPS_GEOJSON, shelterStopsLayer, '#3BB273');

// 6. Buscador
const searchControl = new L.Control.Search({
  layer: L.layerGroup(),           // se llenará dinámicamente
  propertyName: 'featureName',     // campo ficticio que creamos arriba
  zoom: 17,
  marker: false,
  initial: false,
  textPlaceholder: 'Buscar parada…'
});
searchControl.addTo(map);
</script>
</body>
</html>
